[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-portfolio"
version = "0.4.0"
description = "Sanitized quantitative research and portfolio engineering demos"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "quant-data-kit @ git+https://github.com/PureSaber/quant-data-kit.git@v0.6.0",
    "quant-execution @ git+https://github.com/PureSaber/quant-execution.git@v0.4.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=5.0", "ruff>=0.9.0"]

[project.scripts]
quant-portfolio = "quant_portfolio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=quant_portfolio --cov-branch --cov-fail-under=80"

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py310"
