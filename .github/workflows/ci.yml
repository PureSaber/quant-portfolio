name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: |
          python -m pip install --no-deps --requirement requirements.lock
          python -m pip check
          python -m pip install --no-deps --no-build-isolation --editable .
          python -m pip check

      - name: Ruff check
        run: python -m ruff check src tests scripts

      - name: Ruff format
        run: python -m ruff format --check src tests scripts

      - name: Pytest with coverage gate
        run: python -m pytest -q --cov-report=json:coverage.json

      - name: Core pure branch coverage gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          key = str(Path("src/quant_portfolio/cross_asset.py"))
          coverage = json.loads(Path("coverage.json").read_text(encoding="utf-8"))
          files = coverage["files"]
          entry = files.get(key) or files.get(key.replace(chr(92), "/"))
          if entry is None:
              raise SystemExit(f"missing coverage entry for {key}")
          summary = entry["summary"]
          covered = summary["covered_branches"]
          total = summary["num_branches"]
          if total == 0 or covered / total < 0.90:
              raise SystemExit(
                  f"cross_asset.py pure branch coverage {covered}/{total} "
                  f"({covered / total:.2%}) is below 90%"
              )
          print(f"cross_asset.py pure branch coverage: {covered}/{total} ({covered / total:.2%})")

      - name: Run deterministic synthetic demo
        run: |
          python scripts/run_synthetic_demo.py --out "$RUNNER_TEMP/synthetic-demo"
          grep -q "SYNTHETIC DEMONSTRATION" "$RUNNER_TEMP/synthetic-demo/metrics.json"
